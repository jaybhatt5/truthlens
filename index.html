<script>
  // This code runs automatically whenever anyone visits your Cloudflare link
  console.log("============== 🚨 VISIT LOGGED 🚨 ==============");
  console.log("Time Opened :", new Date().toLocaleTimeString());
  console.log("Current URL :", window.location.href);
  console.log("Device Info :", navigator.userAgent);
  console.log("================================================");
</script>
<script>
  const visitData = {
    time: new Date().toLocaleTimeString(),
    url: window.location.href,
    device: navigator.userAgent
  };

  // 1. Log to the browser console (F12)
  console.log("============== 🚨 VISIT LOGGED 🚨 ==============");
  console.log("Time Opened :", visitData.time);
  console.log("Current URL :", visitData.url);
  console.log("Device Info :", visitData.device);
  console.log("================================================");

  // 2. Send it back to your local terminal via Vite's internal logger
  fetch('/__log_visitor', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(visitData)
  }).catch(() => {/* Ignore local network errors */});
</script>
